# Builds and tests Sonolint on every push to main and on pull requests: the whole
# tool on Windows and macOS, and sonolint-core alone on Linux, where JUCE is never
# downloaded (that job is what proves the core doesn't depend on it).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The workflows, the expressions in them and their shell scripts (with the runner's
  # shellcheck), and how they use action.yml.
  lint:
    name: Lint the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      # Most workflows run on Linux, so this is the first thing many people will see.
      - name: Check that the Action says why it doesn't run on Linux
        shell: pwsh
        env:
          INPUT_VERSION: v0.1.0
        run: |
          $output = "$(pwsh -File scripts/get-sonolint.ps1 2>&1)"
          if ($LASTEXITCODE -ne 1 -or -not $output.Contains('::error::Sonolint has binaries for Windows x64 and macOS only')) { throw "exit $LASTEXITCODE, said '$output'" }
          exit 0

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the downloaded dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure, build and test
        shell: pwsh
        run: ./build.ps1

      # What the self-test of the Action runs: the sonolint just built and the test plugin.
      - name: Keep the binary and the test plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-test-${{ runner.os }}
          path: |
            build/sonolint-cli_artefacts/Release/sonolint*
            build/tests/fixtures/SonolintFixture_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 3

      # A real plugin built somewhere else: the latest published release of Heft.
      - name: List the parameters of Heft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Remaori/Heft --pattern '*.zip' --dir heft
          Expand-Archive -Path heft/*.zip -DestinationPath heft
          & ./build/sonolint-cli_artefacts/Release/sonolint.exe list-params --plugin heft/Heft.vst3

  macos:
    name: macOS universal
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the downloaded dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure, build and test
        run: cmake --workflow --preset macos

      # What the self-test of the Action runs: the sonolint just built and the test plugin.
      - name: Keep the binary and the test plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-test-${{ runner.os }}
          path: |
            build/sonolint-cli_artefacts/Release/sonolint*
            build/tests/fixtures/SonolintFixture_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 3

      # One architecture per call: newer versions of lipo accept only one.
      - name: Check that the binary runs on Apple Silicon and Intel
        run: |
          lipo build/sonolint-cli_artefacts/Release/sonolint -verify_arch arm64
          lipo build/sonolint-cli_artefacts/Release/sonolint -verify_arch x86_64

  core-linux:
    name: Core on Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]

    env:
      CXX: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure without JUCE
        run: cmake -S . -B build -DSONOLINT_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The Action of this pull request, run with the binary just built instead of a
  # release. Both jobs comment on the pull request, each its own comment, which later
  # pushes edit (self-test-comments checks it).
  self-test:
    name: Action self-test (${{ matrix.os }})
    needs: [windows, macos]
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: self-test-Windows
            exe: sonolint.exe
            comment: 'true'
          - os: macos-latest
            artifact: self-test-macOS
            exe: sonolint
            comment: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: self-test

      - name: Restore the executable bits, which artifacts drop
        if: runner.os == 'macOS'
        run: chmod -R u+x self-test

      - name: Run the Action
        id: run
        uses: ./
        with:
          binary: self-test/sonolint-cli_artefacts/Release/${{ matrix.exe }}
          plugin: self-test/tests/fixtures/SonolintFixture_artefacts/Release/VST3/SonolintFixture.vst3
          config: tests/integration/gain.yml
          baseline: tests/integration/no-baseline-here.json
          comment: ${{ matrix.comment }}

      - name: Check what the run left
        shell: pwsh
        env:
          STATUS: ${{ steps.run.outputs.status }}
          REGRESSIONS: ${{ steps.run.outputs.regressions }}
          REPORT_DIR: ${{ steps.run.outputs.report-dir }}
        run: |
          if ($env:STATUS -ne 'pass' -or $env:REGRESSIONS -ne '0') { throw "status '$env:STATUS', regressions '$env:REGRESSIONS'" }
          foreach ($file in 'results.json', 'report.md', 'report.html', 'junit.xml') {
              if (-not (Test-Path (Join-Path $env:REPORT_DIR $file))) { throw "$file is missing" }
          }
          $environment = (Get-Content -Raw (Join-Path $env:REPORT_DIR 'results.json') | ConvertFrom-Json).environment
          if (-not $environment.runner_image_os) { throw 'the runner image is not in results.json' }

      # What a comment would say instead of keeping the result of an earlier push.
      - name: Run the Action on a config that isn't there
        id: broken
        continue-on-error: true
        uses: ./
        with:
          id: broken-${{ runner.os }}
          comment: 'false'
          binary: self-test/sonolint-cli_artefacts/Release/${{ matrix.exe }}
          plugin: self-test/tests/fixtures/SonolintFixture_artefacts/Release/VST3/SonolintFixture.vst3
          config: tests/integration/not-there.yml

      - name: Check that it fails and says why
        shell: pwsh
        env:
          OUTCOME: ${{ steps.broken.outcome }}
          STATUS: ${{ steps.broken.outputs.status }}
          REPORT_DIR: ${{ steps.broken.outputs.report-dir }}
        run: |
          if ($env:OUTCOME -ne 'failure' -or $env:STATUS -ne 'fail') { throw "outcome '$env:OUTCOME', status '$env:STATUS'" }
          $report = Get-Content -Raw (Join-Path $env:REPORT_DIR 'report.md')
          if (-not $report.StartsWith('<!-- sonolint:report -->') -or -not $report.Contains("didn't finish:** the config")) { throw "report.md says: $report" }

      - name: Make a baseline with the Action
        id: baseline
        uses: ./
        with:
          mode: baseline
          binary: self-test/sonolint-cli_artefacts/Release/${{ matrix.exe }}
          plugin: self-test/tests/fixtures/SonolintFixture_artefacts/Release/VST3/SonolintFixture.vst3
          config: tests/integration/gain.yml
          baseline: tests/integration/no-baseline-here.json

      - name: Check the baseline
        shell: pwsh
        env:
          REPORT_DIR: ${{ steps.baseline.outputs.report-dir }}
        run: |
          $baseline = Get-Content -Raw (Join-Path $env:REPORT_DIR 'baseline.json') | ConvertFrom-Json
          $platforms = @($baseline.platforms.PSObject.Properties.Name)
          if ($platforms.Count -ne 1) { throw "expected one platform, got: $platforms" }
          Write-Output "Baseline written for $platforms"

  # The Action as people use it: a published release, downloaded, checked and run.
  self-test-release:
    name: Action self-test with a published release (${{ matrix.os }})
    needs: [windows, macos]
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-test-${{ runner.os }}
          path: self-test

      - name: Restore the executable bits, which artifacts drop
        if: runner.os == 'macOS'
        run: chmod -R u+x self-test

      - name: Run the Action with a release
        id: run
        uses: ./
        with:
          version: v0.1.0-rc.3
          id: release-${{ runner.os }}
          comment: 'false'
          plugin: self-test/tests/fixtures/SonolintFixture_artefacts/Release/VST3/SonolintFixture.vst3
          config: tests/integration/gain.yml
          baseline: tests/integration/no-baseline-here.json

      - name: Check that it ran
        shell: pwsh
        env:
          STATUS: ${{ steps.run.outputs.status }}
        run: if ($env:STATUS -ne 'pass') { throw "status '$env:STATUS'" }

  # A pull request from a fork gets a read-only token: the comment can't be posted, and
  # the job must still pass, with a warning.
  self-test-read-only:
    name: Action self-test with a read-only token
    needs: macos
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-test-macOS
          path: self-test

      - name: Restore the executable bits, which artifacts drop
        run: chmod -R u+x self-test

      # Its own id: the macOS self-test above tests the same plugin on the same platform.
      - name: Run the Action
        uses: ./
        with:
          binary: self-test/sonolint-cli_artefacts/Release/sonolint
          plugin: self-test/tests/fixtures/SonolintFixture_artefacts/Release/VST3/SonolintFixture.vst3
          config: tests/integration/gain.yml
          baseline: tests/integration/no-baseline-here.json
          id: read-only

  # A matrix must not clobber its own comments: one per job of self-test, and none twice.
  self-test-comments:
    name: Action self-test, one comment per job
    needs: self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - name: Count the comments of each job
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          $pages = (gh api --paginate --slurp "repos/$env:REPOSITORY/issues/$env:PULL_REQUEST/comments") -join "`n" | ConvertFrom-Json
          $comments = $pages | ForEach-Object { $_ }
          foreach ($id in 'sonolintfixture-windows-x64', 'sonolintfixture-macos-arm64') {
              $count = @($comments | Where-Object { $_.body -and $_.body.StartsWith("<!-- sonolint:report $id -->") }).Count
              if ($count -ne 1) { throw "expected one comment for $id, found $count" }
          }
