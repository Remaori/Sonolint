# Moves the major tag (v0) to the highest published version, by number and never a
# pre-release, so workflows that use Remaori/Sonolint@v0 get it. Run by hand after
# publishing a release.
name: Move the major tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Point the major tag at the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # By number: a fix for an older version can be published after a newer one.
          tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

          if [ -z "$tag" ]; then
            echo "::error::There is no published release yet"
            exit 1
          fi

          major="${tag%%.*}"   # v0.1.0 -> v0
          git tag -f "$major" "$tag^{commit}"
          git push -f origin "refs/tags/$major"
          echo "$major now points to $tag"
